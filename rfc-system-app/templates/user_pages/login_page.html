<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — RFC System</title>
    <link rel="stylesheet" href="{{ url_for('static', path='user_pages/login_page.css') }}">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <a href="/" class="auth-logo">RFC<span>System</span></a>

            <h1 class="auth-title">Вход в систему</h1>
            <p class="auth-subtitle">Войдите, чтобы создавать заявки и отслеживать их статус.</p>

            <form class="auth-form" action="/user/login" method="post">
                <div class="form-group">
                    <label for="email">Рабочая почта</label>
                    <input type="email" id="email" name="email" placeholder="name@company.com" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                </div>

                <div class="form-row">
                    <label class="checkbox">
                        <input type="checkbox" name="remember">
                        <span>Запомнить меня</span>
                    </label>
                    <a href="#" class="auth-link">Забыли пароль?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Войти</button>
            </form>

            <p class="auth-footer-text">
                Ещё нет аккаунта?
                <a href="/user/registration" class="auth-link">Зарегистрироваться</a>
            </p>

            <p class="auth-footer-text">
                <a href="/" class="auth-link">На главную</a>
            </p>
        </div>
    </div>

</body>
</html>
